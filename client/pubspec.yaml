name: student_counseling
description: "학생 상담 관리 시스템"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 상태 관리
  flutter_riverpod: ^2.6.1

  # HTTP 통신
  dio: ^5.7.0

  # 로컬 저장소
  shared_preferences: ^2.3.3

  # UI 컴포넌트
  data_table_2: ^2.5.15
  fl_chart: ^0.69.2
  intl: any

  # 폼
  flutter_form_builder: ^10.3.0
  form_builder_validators: ^11.1.0

  # 라우팅
  go_router: ^14.6.2

  # 윈도우 관리 (데스크톱)
  window_manager: ^0.4.3

  # 유틸
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.7
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # 코드 생성
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
